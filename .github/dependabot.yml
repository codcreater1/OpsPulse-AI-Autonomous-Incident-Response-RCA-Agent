version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Only propose a change when the new release falls outside the declared range (no lower-bound churn).
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    groups:
      llm-stack:
        patterns: ["langgraph", "langchain*", "groq", "langfuse"]
    ignore:
      # langchain-groq 1.1.x requires groq<1.0; lift this once langchain-groq supports groq 1.x.
      - dependency-name: groq
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The image must use the Python version CI tests (3.11); move both together, deliberately.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
