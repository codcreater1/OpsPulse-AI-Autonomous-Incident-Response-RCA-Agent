name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, offline evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets are used: unit tests, migrations and the mock evaluation run fully offline.
    env:
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src tests evals scripts migrations

      - name: Ruff format check
        run: ruff format --check src tests evals scripts migrations

      - name: Type check
        run: mypy

      - name: Import / configuration smoke check
        run: python -c "import src.main; from src.services.incident_service import get_graph; get_graph()"

      - name: Unit tests with coverage
        run: pytest --cov=src --cov=evals --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Offline (mock) evaluation with regression thresholds
        run: >
          python -m evals.run_rca --mode mock
          --min structured_output_validity=0.9
          --min evidence_grounding_accuracy=0.95
          --min inconclusive_not_accepted_rate=1.0

      - name: Retrieval evaluation (fails on any cross-repository leak)
        run: python -m evals.run_retrieval

      - name: Demo (mock model, sandboxed test run)
        run: python -m scripts.demo

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            coverage.xml
            evals/reports/
          if-no-files-found: ignore

  postgres:
    name: Migrations and tests on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: opspulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspulse -d opspulse"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://opspulse:ci-only-password@localhost:5432/opspulse
      TEST_DATABASE_URL: postgresql://opspulse:ci-only-password@localhost:5432/opspulse
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrations upgrade / downgrade / upgrade round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models and migrated schema agree
        run: alembic check

      - name: Unit tests against PostgreSQL
        run: pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t opspulse-ai:ci .
