# Local stack: API, a separate queue worker and a throwaway PostgreSQL.
# For Neon, drop the `db` service and set DATABASE_URL in .env.
# Scale analysis throughput with:  docker compose up --scale worker=3
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspulse
      POSTGRES_PASSWORD: opspulse-local-only
      POSTGRES_DB: opspulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspulse -d opspulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql://opspulse:opspulse-local-only@db:5432/opspulse
      EMBEDDED_WORKER: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *app
    # Migrations are applied by the api container; the worker only polls the queue.
    command: ["python", "-m", "src.worker"]
    environment:
      DATABASE_URL: postgresql://opspulse:opspulse-local-only@db:5432/opspulse
      WORKER_LIVENESS_FILE: /tmp/opspulse-worker-alive
    # Liveness: the worker touches the file on every loop and every lease renewal (<= 30 s apart).
    healthcheck:
      test: ["CMD", "python", "-m", "src.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
